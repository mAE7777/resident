# Resident configuration
# Copy to config.yaml and fill in your values.
# Environment variable overrides: RESIDENT__SECTION__KEY (double underscore delimiter)
# Example: RESIDENT__LLM__DAILY_BUDGET_CENTS=500

# ── LLM Provider ──────────────────────────────────────────────────────
llm:
  apiKeys:
    - "sk-ant-your-anthropic-api-key-here"
  baseUrl: "https://api.anthropic.com"
  dailyBudgetCents: 1000  # $10/day default
  rateLimits:
    rpm: 60
  models:
    default:
      id: "claude-sonnet-4-6"
      maxContextTokens: 1000000
      maxOutputTokens: 64000
      costPerMInputTokens: 3
      costPerMOutputTokens: 15
    upgrade:
      id: "claude-opus-4-7"
      maxContextTokens: 1000000
      maxOutputTokens: 128000
      costPerMInputTokens: 5
      costPerMOutputTokens: 25
    background:
      id: "claude-haiku-4-5"
      maxContextTokens: 200000
      maxOutputTokens: 64000
      costPerMInputTokens: 1
      costPerMOutputTokens: 5

# ── Telegram ──────────────────────────────────────────────────────────
telegram:
  botToken: "123456789:ABCdef-your-telegram-bot-token"
  allowedUserIds:
    - 123456789  # Your Telegram user ID (send /start to @userinfobot to find it)

# ── Search (optional) ────────────────────────────────────────────────
# search:
#   apiKey: ""  # Brave Search API key (free: 2000 queries/month at https://api.search.brave.com)

# ── Security ──────────────────────────────────────────────────────────
# The four-level autonomy/trust ladder was removed: she is not rated. What limits her is the home
# boundary (absolute, first, nothing overrides it), her birth toolkit, and the unconditional
# action-danger checks. The only setting left here is optional extra security zones.
# security:
#   zones: []

# ── Sandbox ──────────────────────────────────────────────────────────
# sandbox:
#   enabled: false      # /sandbox on enables Docker-backed bash at runtime
#   image: "node:22-slim"
#   network: false
#   policy: "workspace-write"

# ── Her home ──────────────────────────────────────────────────────────
# Deliberately not set here. Everything she keeps (workspace + database) derives
# from one root, ~/.resident, and the daemon refuses to start if any of it
# resolves elsewhere.
#
# These two keys exist and still work, but setting them re-creates the split this
# is here to prevent: they were independent, so moving one and leaving the other
# put half her life in another agent's home, and BOTH halves failed silently.
# To relocate her, set RESIDENT_HOME or pass --home. Both move the whole thing.
#
# workspace:
#   path: "~/.resident/workspace"
# database:
#   dbPath: "~/.resident/data.db"   # must be under the same root as the workspace
